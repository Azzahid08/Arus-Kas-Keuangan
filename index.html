<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arus Kas MTG</title>
  
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F4F5F0;
    --surface:#FFFFFF;
    --surface-alt:#ECEEE8;
    --ink:#16212B;
    --ink-soft:#5B6672;
    --ink-faint:#8B95A0;
    --navy:#123324;
    --navy-soft:#1D4A37;
    --gold:#AD8A1E;
    --gold-soft:#F4EAC9;
    --emerald:#1F7A5C;
    --emerald-soft:#E1F0E9;
    --rust:#B4472B;
    --rust-soft:#F6E4DD;
    --border:#E0E3DB;
    --radius:12px;
    --shadow:0 1px 2px rgba(18,41,61,0.06), 0 4px 16px rgba(18,41,61,0.05);
  }
  *{box-sizing:border-box;}
  body, html { margin:0; padding:0; background:var(--bg); }

  .mtg-app{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding:0;
    line-height:1.4;
  }
  .mtg-app h1,.mtg-app h2,.mtg-app h3{
    font-family:'Space Grotesk',system-ui,sans-serif;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Header ---------- */
  .mtg-header{
    background:var(--navy);
    color:#fff;
    padding:22px 28px 0 28px;
    border-radius:0 0 16px 16px;
  }
  .mtg-header-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .mtg-brand{display:flex; align-items:center; gap:12px;}
  .mtg-brand-mark{
    width:42px;height:42px;border-radius:10px;
    background:linear-gradient(135deg,var(--gold) 0%, #8a6d10 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;font-size:16px;color:#fff;
    flex-shrink:0; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .mtg-brand-img{
    height:42px; width:auto; max-width:120px; object-fit:contain; border-radius:8px;
  }
  .mtg-brand-title{font-size:20px;font-weight:700;color:#fff;}
  .mtg-brand-sub{font-size:12.5px;color:#A2C9B6;margin-top:2px;display:flex;align-items:center;gap:8px;}
  
  .mtg-sync-status{
    font-size:11px; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,0.12); color:#E1F0E9;
    display:inline-flex; align-items:center; gap:4px; transition:all .3s ease;
  }
  .mtg-sync-btn{
    background:transparent; border:none; color:#A2C9B6; cursor:pointer; font-size:13px; padding:2px 6px; border-radius:4px;
  }
  .mtg-sync-btn:hover{ color:#fff; background:rgba(255,255,255,0.1); }

  /* GROUP SALDO BARU */
  .mtg-balance-group{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;
  }
  .mtg-balance-pill{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:10px; padding:10px 14px; text-align:right; min-width:140px;
  }
  .mtg-balance-pill.total{
    background:rgba(173,138,30,0.2); border-color:rgba(173,138,30,0.4);
  }
  .mtg-balance-pill .lbl{font-size:10.5px;color:#A2C9B6;text-transform:uppercase;letter-spacing:.05em;}
  .mtg-balance-pill.total .lbl{color:#F4EAC9;}
  .mtg-balance-pill .val{font-family:'IBM Plex Mono';font-size:18px;font-weight:600;color:#fff;margin-top:2px;}

  .mtg-tabs{display:flex;gap:4px;margin-top:20px;overflow-x:auto;padding-bottom:2px;}
  .mtg-tab{
    padding:11px 18px; border-radius:10px 10px 0 0; cursor:pointer;
    font-size:13.5px; font-weight:600; color:#A2C9B6; background:transparent;
    border:none; transition:all .15s ease; display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .mtg-tab:hover{color:#fff; background:rgba(255,255,255,0.06);}
  .mtg-tab.active{color:var(--navy); background:var(--bg);}

  /* ---------- Body ---------- */
  .mtg-body{padding:22px 28px 32px 28px;}
  .mtg-section-title{
    font-size:15px; font-weight:600; color:var(--navy); margin:26px 0 12px 0;
    display:flex; align-items:center; gap:8px;
  }
  .mtg-section-title .bar{width:4px;height:16px;background:var(--gold);border-radius:2px;display:inline-block;}
  .mtg-section-title:first-child{margin-top:0;}

  /* ---------- Filter bar ---------- */
  .mtg-filterbar{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 18px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; box-shadow:var(--shadow);
  }
  .mtg-filter-group{display:flex; align-items:center; gap:8px;}
  .mtg-filter-group label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .mtg-select{
    border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13.5px;
    font-family:'Inter'; background:#fff; color:var(--ink); font-weight:600; cursor:pointer;
  }
  .mtg-filter-note{font-size:12px; color:var(--ink-faint); margin-left:auto;}

  /* ---------- KPI cards ---------- */
  .mtg-kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:14px;}
  .mtg-kpi-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .mtg-kpi-card::before{
    content:''; position:absolute; top:0; left:0; width:100%; height:3px;
  }
  .mtg-kpi-card.masuk::before{background:var(--emerald);}
  .mtg-kpi-card.keluar::before{background:var(--rust);}
  .mtg-kpi-card.selisih::before{background:var(--gold);}
  .mtg-kpi-card.saldo::before{background:var(--navy);}
  .mtg-kpi-label{font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .mtg-kpi-value{font-family:'IBM Plex Mono'; font-size:20px; font-weight:600; margin-top:8px; color:var(--ink);}
  .mtg-kpi-value.neg{color:var(--rust);}

  /* ---------- Charts grid ---------- */
  .mtg-chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  .mtg-chart-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .mtg-chart-card h4{font-size:13px; font-weight:600; color:var(--navy); margin-bottom:10px;}
  .chart-box{position:relative; height:230px; width:100%; display:flex; align-items:center; justify-content:center;}
  .chart-box canvas{max-height:none !important; width:100% !important;}

  /* ---------- Tables ---------- */
  .mtg-table-wrap{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .mtg-table-scroll{overflow-x:auto;}
  table.mtg-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.mtg-table thead th{
    background:var(--navy); color:#fff; text-align:left; padding:10px 14px; font-weight:600; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; position:sticky; top:0;
  }
  table.mtg-table tbody td{padding:9px 14px; border-bottom:1px solid var(--border); white-space:nowrap; color:var(--ink);}
  table.mtg-table tbody tr:hover{background:var(--surface-alt);}
  table.mtg-table tbody tr:last-child td{border-bottom:none;}
  .num{font-family:'IBM Plex Mono'; text-align:right; font-variant-numeric:tabular-nums;}
  .neg-row td.num.saldo-cell{color:var(--rust); font-weight:600;}
  .tag{
    display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600;
  }
  .tag-masuk{background:var(--emerald-soft); color:var(--emerald);}
  .tag-keluar{background:var(--rust-soft); color:var(--rust);}
  .tag-awal{background:var(--gold-soft); color:var(--gold);}
  .tag-mutasi{background:#E0E3DB; color:#5B6672;}
  
  .klas-chip{
    display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600;
    background:var(--surface-alt); color:var(--navy-soft);
  }
  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    border-radius:50%; background:var(--gold-soft); color:var(--gold); font-weight:700; font-size:11.5px;
  }

  /* ---------- Buttons ---------- */
  .mtg-btn{
    border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:'Inter'; display:inline-flex; align-items:center; gap:6px; transition:all .15s ease;
  }
  .mtg-btn-primary{background:var(--navy); color:#fff;}
  .mtg-btn-primary:hover{background:var(--navy-soft);}
  .mtg-btn-gold{background:var(--gold); color:#fff;}
  .mtg-btn-gold:hover{opacity:.9;}
  .mtg-btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border);}
  .mtg-btn-ghost:hover{background:var(--surface-alt);}
  .mtg-btn-danger{background:transparent; color:var(--rust);}
  .mtg-btn-danger:hover{background:var(--rust-soft);}
  .mtg-btn-sm{padding:5px 10px; font-size:12px;}
  .mtg-btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ---------- Forms ---------- */
  .mtg-form-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow);
  }
  .mtg-form-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .mtg-field{display:flex; flex-direction:column; gap:5px;}
  .mtg-field label{font-size:11.5px; font-weight:600; color:var(--ink-soft);}
  .mtg-input,.mtg-form-grid select{
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px;
    font-family:'Inter'; background:#fff; color:var(--ink);
  }
  .mtg-input:focus,.mtg-form-grid select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .mtg-form-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}

  /* ---------- Canvassing ---------- */
  .mtg-trip-grid{display:grid; grid-template-columns:260px 1fr; gap:16px; margin-top:14px; align-items:start;}
  .mtg-trip-list{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .mtg-trip-item{
    padding:13px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s ease;
  }
  .mtg-trip-item:last-child{border-bottom:none;}
  .mtg-trip-item:hover{background:var(--surface-alt);}
  .mtg-trip-item.active{background:var(--gold-soft); border-left:3px solid var(--gold);}
  .mtg-trip-item .nm{font-weight:600; font-size:13.5px; color:var(--navy);}
  .mtg-trip-item .pd{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  .mtg-trip-item .sisa{font-size:11.5px; margin-top:3px; font-family:'IBM Plex Mono'; font-weight:600;}
  .mtg-trip-add{padding:12px 16px; text-align:center;}

  .mtg-empty{
    text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13.5px;
  }
  .mtg-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:10px;}
  .mtg-summary-strip{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px;}
  .mtg-summary-box{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .mtg-summary-box .lbl{font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase;}
  .mtg-summary-box .val{font-family:'IBM Plex Mono'; font-size:17px; font-weight:600; margin-top:4px;}
  .mtg-summary-box.highlight{border-color:var(--navy); background:var(--surface-alt);}

  .mtg-modal-overlay{
    position:fixed; inset:0; background:rgba(18,41,61,0.45); display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
  }
  .mtg-modal{
    background:#fff; border-radius:14px; padding:22px; width:100%; max-width:480px; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .mtg-modal h3{font-size:16px; margin-bottom:4px;}
  .mtg-modal p{font-size:13px; color:var(--ink-soft); margin:0 0 16px 0;}

  .mtg-icon-btn{
    background:transparent; border:none; cursor:pointer; padding:5px; border-radius:6px; color:var(--ink-faint);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .mtg-icon-btn:hover{background:var(--surface-alt); color:var(--ink);}

  /* ---------- RESPONSIF HP & TABLET ---------- */
  @media (max-width: 768px){
    .mtg-header { padding: 16px 16px 0 16px; }
    .mtg-header-top { flex-direction: column; gap: 12px; }
    
    .mtg-balance-group { flex-direction: column; width: 100%; gap: 8px; }
    .mtg-balance-pill { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 10px 14px; }
    .mtg-balance-pill .val { margin-top: 0; font-size: 16px; }

    .mtg-body { padding: 16px 14px 28px 14px; }
    
    .mtg-kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
    .mtg-kpi-card { padding: 12px 14px !important; }
    .mtg-kpi-value { font-size: 15px !important; }
    
    .mtg-chart-grid { grid-template-columns: 1fr !important; }
    .mtg-filterbar { flex-direction: column; align-items: stretch; gap: 10px; }
    .mtg-filter-note { margin-left: 0; font-size: 11px; }
    
    .mtg-form-grid { grid-template-columns: 1fr !important; }
    .mtg-field[style*="grid-column"] { grid-column: span 1 !important; }
    
    .mtg-trip-grid { grid-template-columns: 1fr !important; }
    .mtg-summary-strip { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
  }
  </style>
</head>
<body>

<div class="mtg-app" id="mtgApp">
  <div class="mtg-header">
    <div class="mtg-header-top">
      <div class="mtg-brand">
        <img src="logo.png" alt="Logo" class="mtg-brand-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="mtg-brand-mark" style="display:none;">MTG</div>
        <div>
          <div class="mtg-brand-title">Arus Kas MTG</div>
          <div class="mtg-brand-sub">
            <span>Dashboard · Buku Kas · Canvassing</span>
            <span class="mtg-sync-status" id="cloudStatus">🟢 Cloud Sync</span>
            <button class="mtg-sync-btn" id="btnManualRefresh" title="Refresh Data Sekarang">🔄</button>
          </div>
        </div>
      </div>
      
      <!-- KOTAK SALDO TERPISAH: BCA, CASH, & TOTAL -->
      <div class="mtg-balance-group">
        <div class="mtg-balance-pill">
          <div class="lbl">Saldo Kas BCA</div>
          <div class="val mono" id="headerBCA">Rp 0</div>
        </div>
        <div class="mtg-balance-pill">
          <div class="lbl">Saldo Cash Kantor</div>
          <div class="val mono" id="headerCash">Rp 0</div>
        </div>
        <div class="mtg-balance-pill total">
          <div class="lbl">Saldo Kas Saat Ini</div>
          <div class="val mono" id="headerSaldo">Rp 0</div>
        </div>
      </div>
      
    </div>
    <div class="mtg-tabs" id="mtgTabs"></div>
  </div>
  <div class="mtg-body" id="mtgBody"></div>
</div>

<script src="https://unpkg.com/chart.js@4.4.3/dist/chart.umd.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<script>
(function(){
"use strict";

const SEED_DATA = {"ledger": [{"tanggal": "2026-05-01", "kategori": "Kas Awal", "klasifikasi": "Modal Awal", "keterangan": "Setoran modal awal pemilik", "akun": "BCA", "masuk": 50000000.0, "keluar": 0}], "trips": []};

const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const KATEGORI_LIST = ["Kas Awal","Pemasukan","Pengeluaran", "Mutasi"]; // Ditambah Kategori Mutasi
const KLASIFIKASI_LIST = ["Modal Awal","Pemasukan Modal","Canvassing","Perlengkapan & Aset Kantor","Operasional Kantor","Transportasi & Kendaraan","Marketing & Branding","Konsumsi","Mutasi","Lain-lain"];
const KLAS_EXPENSE_ONLY = KLASIFIKASI_LIST.filter(k => k !== "Modal Awal" && k !== "Pemasukan Modal" && k !== "Mutasi");
const AKUN_LIST = ["BCA","Cash"];
const CANV_KATEGORI = ["Keluar Rekening","Perjalanan","Makan & Minum","Penginapan","Lain-lain"];
const CANV_METODE = ["BCA","Cash","Flazz/Tunai"];
const KLAS_COLORS = {
  "Canvassing":"#AD8A1E", "Perlengkapan & Aset Kantor":"#123324", "Operasional Kantor":"#1F7A5C",
  "Transportasi & Kendaraan":"#B4472B", "Marketing & Branding":"#6B5CA5", "Konsumsi":"#2E86AB", "Mutasi":"#5B6672", "Lain-lain":"#8B95A0"
};

let state = {
  ledger: [],
  trips: [],
  activeTab: "dashboard",
  filterYear: 2026,
  filterMonth: "Semua",
  activeTripId: null,
  editingTxnId: null,
  editingTripExpenseId: null,
  isSyncing: false
};

let chartRegistry = {};

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function fmtRp(n){
  n = Math.round(Number(n)||0);
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('id-ID');
  return (neg ? '-Rp ' : 'Rp ') + s;
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const mon = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return String(d.getDate()).padStart(2,'0') + ' ' + mon[d.getMonth()] + ' ' + d.getFullYear();
}
function monthOf(iso){ return MONTHS[new Date(iso+'T00:00:00').getMonth()]; }
function yearOf(iso){ return new Date(iso+'T00:00:00').getFullYear(); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setCloudStatus(status){
  const el = document.getElementById('cloudStatus');
  if(!el) return;
  if(status === 'saving') { el.innerHTML = '⏳ Menyimpan...'; el.style.color = '#F4EAC9'; }
  else if(status === 'loading') { el.innerHTML = '🔄 Memuat...'; el.style.color = '#A2C9B6'; }
  else if(status === 'error') { el.innerHTML = '⚠️ Gagal'; el.style.color = '#F2B8A8'; }
  else { el.innerHTML = '🟢 Cloud Sync'; el.style.color = '#E1F0E9'; }
}

/* ---------------- Storage (Terkoneksi ke Google Sheets API) ---------------- */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzHWh0LSoSV9XHWGhQH3twHM2oKXuaeBBAbBN3EnOTFSb1aMddb0KpAPEk6Q0BfTTKCVQ/exec";

async function loadData(silent = false){
  if(state.isSyncing) return;
  if(!silent) setCloudStatus('loading');
  try {
    const res = await fetch(SHEET_API_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("Status: " + res.status);
    const data = await res.json();
    
    state.ledger = (data.ledger && data.ledger.length > 0) ? data.ledger : SEED_DATA.ledger.map(d => ({ id: uid(), ...d }));
    state.trips = (data.trips && data.trips.length > 0) ? data.trips : SEED_DATA.trips.map(tr => ({
      id: uid(), nama: tr.nama, periode: tr.periode,
      expenses: tr.expenses.map(e => ({ id: uid(), ...e }))
    }));

    syncCanvassingToLedger();
    render();
    setCloudStatus('ok');
  } catch(e) {
    console.warn("Koneksi ke Google Sheets terhalang. Memuat data cadangan...", e);
    setCloudStatus('error');
  }
}

async function saveLedger(){
  state.isSyncing = true;
  setCloudStatus('saving');
  try {
    await fetch(SHEET_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveLedger', data: state.ledger }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    setCloudStatus('ok');
  } catch(e) { 
    console.error("Gagal menyimpan Ledger ke Sheets:", e); 
    setCloudStatus('error');
  } finally {
    state.isSyncing = false;
  }
}

async function saveTrips(){
  state.isSyncing = true;
  setCloudStatus('saving');
  try {
    await fetch(SHEET_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveTrips', data: state.trips }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    setCloudStatus('ok');
  } catch(e) { 
    console.error("Gagal menyimpan Trips ke Sheets:", e); 
    setCloudStatus('error');
  } finally {
    state.isSyncing = false;
  }
}

/* ---------------- AUTO-SYNC CANVASSING KE LEDGER ---------------- */
function syncCanvassingToLedger(){
  const activeTripIds = new Set(state.trips.map(t => t.id));

  state.ledger = state.ledger.filter(row => {
    if (row.id && row.id.startsWith('sync_trip_')) {
      const tripId = row.id.replace('sync_trip_', '');
      return activeTripIds.has(tripId);
    }
    return true;
  });

  state.trips.forEach(trip => {
    const tot = tripTotals(trip);
    const syncId = 'sync_trip_' + trip.id;
    const existingIndex = state.ledger.findIndex(r => r.id === syncId);

    if (tot.totalRealisasi > 0) {
      let txDate = new Date().toISOString().slice(0, 10);
      if (trip.expenses && trip.expenses.length > 0) {
        const sortedDates = [...trip.expenses].map(e => e.tanggal).sort().reverse();
        if (sortedDates[0]) txDate = sortedDates[0];
      }

      const syncRow = {
        id: syncId,
        tanggal: txDate,
        kategori: 'Pengeluaran',
        klasifikasi: 'Canvassing',
        keterangan: 'Canvassing ' + trip.nama + (trip.periode ? ' (' + trip.periode + ')' : ''),
        akun: 'BCA', // Default sinkronisasi dari BCA
        masuk: 0,
        keluar: tot.totalRealisasi
      };

      if (existingIndex >= 0) {
        state.ledger[existingIndex] = { ...state.ledger[existingIndex], ...syncRow };
      } else {
        state.ledger.push(syncRow);
      }
    } else {
      if (existingIndex >= 0) {
        state.ledger.splice(existingIndex, 1);
      }
    }
  });
}

async function saveTripsAndSync(){
  syncCanvassingToLedger();
  await saveTrips();
  await saveLedger();
}

/* ---------------- Derived Data & KPI ---------------- */
function sortedLedger(){
  return [...state.ledger].sort((a,b) => a.tanggal < b.tanggal ? -1 : (a.tanggal > b.tanggal ? 1 : 0));
}
function ledgerWithBalance(){
  const sorted = sortedLedger();
  let bal = 0;
  return sorted.map(row => {
    bal += (Number(row.masuk)||0) - (Number(row.keluar)||0);
    return { ...row, saldo: bal };
  });
}
function availableYears(){
  const ys = new Set(state.ledger.map(r => yearOf(r.tanggal)));
  if(ys.size === 0) ys.add(new Date().getFullYear());
  return [...ys].sort();
}
function filteredLedger(){
  const withBal = ledgerWithBalance();
  return withBal.filter(r => {
    if(yearOf(r.tanggal) !== state.filterYear) return false;
    if(state.filterMonth !== 'Semua' && monthOf(r.tanggal) !== state.filterMonth) return false;
    return true;
  });
}

function kpis(){
  const withBal = ledgerWithBalance();
  const f = filteredLedger();
  
  // NOTE: Transaksi Mutasi TIDAK dihitung dalam KPI Masuk & Keluar agar tidak menggelembungkan omset/pengeluaran palsu.
  const masuk = f.reduce((s,r) => s + (r.kategori !== 'Mutasi' ? (Number(r.masuk)||0) : 0), 0);
  const keluar = f.reduce((s,r) => s + (r.kategori !== 'Mutasi' ? (Number(r.keluar)||0) : 0), 0);

  let saldoAwal = 0;
  let saldoAkhirPeriode = 0;

  if (withBal.length > 0) {
    const y = state.filterYear;
    const m = state.filterMonth;
    
    let lastBefore = null;
    for (let i = 0; i < withBal.length; i++) {
       const r = withBal[i];
       const rY = yearOf(r.tanggal);
       const rM = monthOf(r.tanggal);
       
       if (m === 'Semua') {
          if (rY < y) lastBefore = r;
          else break;
       } else {
          const mIndex = MONTHS.indexOf(m);
          const rMIndex = MONTHS.indexOf(rM);
          if (rY < y || (rY === y && rMIndex < mIndex)) {
             lastBefore = r;
          } else {
             break; 
          }
       }
    }
    
    saldoAwal = lastBefore ? lastBefore.saldo : 0;
    
    if (f.length > 0) {
      saldoAkhirPeriode = f[f.length - 1].saldo;
    } else {
      saldoAkhirPeriode = saldoAwal;
    }
  }

  return { masuk, keluar, saldoAwal, saldoAkhirPeriode };
}

function monthlyTrend(){
  const year = state.filterYear;
  const withBal = ledgerWithBalance();
  return MONTHS.map(bln => {
    // Mengecualikan transaksi 'Mutasi' dari grafik tren pengeluaran
    const rows = withBal.filter(r => yearOf(r.tanggal) === year && monthOf(r.tanggal) === bln && r.kategori !== 'Mutasi');
    const masuk = rows.reduce((s,r)=>s+(Number(r.masuk)||0),0);
    const keluar = rows.reduce((s,r)=>s+(Number(r.keluar)||0),0);
    return { bulan: bln, masuk, keluar };
  });
}
function klasifikasiBreakdown(){
  const f = filteredLedger().filter(r => r.kategori === 'Pengeluaran' && r.klasifikasi !== 'Mutasi');
  const map = {};
  KLAS_EXPENSE_ONLY.forEach(k => map[k] = 0);
  f.forEach(r => { map[r.klasifikasi] = (map[r.klasifikasi]||0) + (Number(r.keluar)||0); });
  const total = Object.values(map).reduce((a,b)=>a+b,0);
  return Object.entries(map)
    .map(([klas, jumlah]) => ({ klas, jumlah, pct: total ? jumlah/total : 0 }))
    .sort((a,b) => b.jumlah - a.jumlah);
}
function topExpenses(n){
  const f = filteredLedger().filter(r => r.kategori === 'Pengeluaran' && r.klasifikasi !== 'Mutasi' && (Number(r.keluar)||0) > 0);
  return [...f].sort((a,b) => (b.keluar||0) - (a.keluar||0)).slice(0, n);
}

/* ---------------- Logika Canvassing ---------------- */
function tripTotals(trip){
  const ditarik = trip.expenses.reduce((s,e) => s + (Number(e.keluarRek)||0), 0);
  const realisasiCash = trip.expenses.reduce((s,e) => s + (e.metode === 'Cash' ? (Number(e.realisasi)||0) : 0), 0);
  const realisasiBCA = trip.expenses.reduce((s,e) => s + (e.metode === 'BCA' ? (Number(e.realisasi)||0) : 0), 0);
  const realisasiFlazz = trip.expenses.reduce((s,e) => s + (e.metode !== 'Cash' && e.metode !== 'BCA' ? (Number(e.realisasi)||0) : 0), 0);
  const realisasiNonCash = realisasiBCA + realisasiFlazz;
  const totalRealisasi = realisasiCash + realisasiNonCash;
  const sisaCash = ditarik - realisasiCash;

  return { ditarik, realisasiCash, realisasiBCA, realisasiFlazz, realisasiNonCash, totalRealisasi, sisaCash, pct: ditarik ? (realisasiCash / ditarik) : 0 };
}
function tripKategoriBreakdown(trip){
  const map = {}; CANV_KATEGORI.forEach(k => map[k]=0);
  trip.expenses.forEach(e => { map[e.kategori] = (map[e.kategori]||0) + (Number(e.keluarRek)||0) + (Number(e.realisasi)||0); });
  return CANV_KATEGORI.map(k => ({ kategori:k, jumlah: map[k] }));
}
function tripMetodeBreakdown(trip){
  const map = {}; CANV_METODE.forEach(k => map[k]=0);
  trip.expenses.forEach(e => { map[e.metode] = (map[e.metode]||0) + (Number(e.keluarRek)||0) + (Number(e.realisasi)||0); });
  return CANV_METODE.map(k => ({ metode:k, jumlah: map[k] }));
}

/* ---------------- FITUR DOWNLOAD LAPORAN DASHBOARD PDF ---------------- */
function generateDashboardPDF() {
  try {
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert('Modul PDF belum siap dimuat. Coba lagi sesaat lagi.');
      return;
    }
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
    
    const periodeTxt = state.filterMonth === 'Semua' ? 'Tahun ' + state.filterYear : state.filterMonth + ' ' + state.filterYear;
    
    const k = kpis();
    // Ambil data detail pengeluaran untuk tabel
    const fExpenses = filteredLedger().filter(r => r.kategori === 'Pengeluaran' && r.klasifikasi !== 'Mutasi');
    const rows = fExpenses.sort((a,b)=> a.tanggal < b.tanggal ? -1 : (a.tanggal>b.tanggal?1:0));

    const marginX = 40;
    let y = 50;

    // Header Laporan
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(18,51,36);
    doc.text('Laporan Arus Kas MTG', marginX, y);
    y += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,100,110);
    doc.text('Periode: ' + periodeTxt, marginX, y);
    doc.text('Dicetak: ' + new Date().toLocaleDateString('id-ID', {day:'2-digit',month:'long',year:'numeric'}), 400, y);
    y += 20;

    doc.setDrawColor(224,227,219);
    doc.line(marginX, y, 555, y);
    y += 20;

    // KPI Boxes
    const boxes = [
      ['Saldo Awal', fmtRp(k.saldoAwal)],
      ['Kas Masuk', fmtRp(k.masuk)],
      ['Kas Keluar', fmtRp(k.keluar)],
      ['Saldo Akhir', fmtRp(k.saldoAkhirPeriode)]
    ];
    
    const boxW = 115, boxH = 46;
    boxes.forEach((b, i) => {
      const bx = marginX + i*(boxW+6);
      doc.setFillColor(i===3 ? 236 : 244, i===3 ? 238 : 245, i===3 ? 232 : 240);
      doc.roundedRect(bx, y, boxW, boxH, 4, 4, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(i===3 ? 18 : 91, i===3 ? 51 : 102, i===3 ? 36 : 114);
      doc.text(b[0].toUpperCase(), bx+8, y+16);
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(18,51,36);
      doc.text(b[1], bx+8, y+34);
    });
    y += boxH + 28;

    // Judul Tabel
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(18,51,36);
    doc.text('Rincian Seluruh Pengeluaran Periode Ini', marginX, y);
    
    // AutoTable untuk rincian
    doc.autoTable({
      startY: y+8, margin:{left:marginX, right:40},
      head:[['Tanggal','Klasifikasi','Keterangan','Akun','Jumlah (IDR)']],
      body: rows.map(e => [
        fmtDate(e.tanggal), e.klasifikasi, e.keterangan, e.akun, fmtRp(e.keluar)
      ]),
      styles:{ font:'helvetica', fontSize:8.5, cellPadding:4.5, overflow:'linebreak' },
      headStyles:{ fillColor:[18,51,36], textColor:255, fontSize:8.5 },
      columnStyles:{ 4:{ halign:'right' } },
      theme:'grid',
      didDrawPage: (data) => {
        const pageCount = doc.internal.getNumberOfPages();
        doc.setFontSize(8); doc.setTextColor(139,149,160);
        doc.text('Arus Kas MTG — Laporan ' + periodeTxt, marginX, 820);
        doc.text('Hal. ' + doc.internal.getCurrentPageInfo().pageNumber + ' / ' + pageCount, 500, 820);
      }
    });

    const safeName = periodeTxt.replace(/[^a-z0-9]+/gi,'_');
    doc.save('Laporan_Bulanan_MTG_' + safeName + '.pdf');
  } catch(err) {
    console.error('Gagal membuat PDF:', err);
    alert('Gagal membuat PDF. Silakan coba lagi.');
  }
}

function destroyChart(key){
  if(chartRegistry[key]){ 
    chartRegistry[key].destroy(); 
    delete chartRegistry[key]; 
  }
}

function drawDashboardCharts(trend, klas, retries = 0){
  if (typeof window.Chart === 'undefined') {
    if (retries < 20) {
      setTimeout(() => drawDashboardCharts(trend, klas, retries + 1), 250);
    } else {
      const errHtml = '<div style="color:var(--rust); padding:20px; font-size:12px; border:1px dashed var(--rust); border-radius:8px; text-align:center; width:100%;"><b>Error:</b> Pustaka grafik gagal diunduh.</div>';
      ['boxTrendBar', 'boxTrendLine', 'boxKlasPie', 'boxKlasBar'].forEach(id => {
         const el = document.getElementById(id);
         if(el) el.innerHTML = errHtml;
      });
    }
    return;
  }
  
  try{
    ['chartTrendBar','chartTrendLine','chartKlasPie','chartKlasBar'].forEach(destroyChart);

    const ctxBar = document.getElementById('chartTrendBar');
    if(ctxBar){
      chartRegistry['chartTrendBar'] = new Chart(ctxBar, {
        type:'bar',
        data:{ labels: trend.map(t=>t.bulan.slice(0,3)),
          datasets:[
            // Dihapus (KAS MASUK) untuk menyesuaikan fokus ke Kas Keluar Saja
            {label:'Kas Keluar', data: trend.map(t=>t.keluar), backgroundColor:'#B4472B', borderRadius:4},
          ]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}},
          scales:{ y:{ ticks:{ callback:v=>fmtRp(v) , font:{size:10}} }, x:{ ticks:{font:{size:10}} } } }
      });
    }
    
    const ctxLine = document.getElementById('chartTrendLine');
    if(ctxLine){
      let running = 0;
      const saldoSeries = trend.map(t => { running += t.masuk - t.keluar; return running; });
      chartRegistry['chartTrendLine'] = new Chart(ctxLine, {
        type:'line',
        data:{ labels: trend.map(t=>t.bulan.slice(0,3)),
          datasets:[{ label:'Saldo Total', data: saldoSeries, borderColor:'#AD8A1E', backgroundColor:'#AD8A1E33',
            tension:.3, fill:true, pointRadius:3 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
          scales:{ y:{ ticks:{ callback:v=>fmtRp(v), font:{size:10} } }, x:{ ticks:{font:{size:10}} } } }
      });
    }
    
    const ctxPie = document.getElementById('chartKlasPie');
    if(ctxPie){
      const nz = klas.filter(k=>k.jumlah>0);
      chartRegistry['chartKlasPie'] = new Chart(ctxPie, {
        type:'doughnut',
        data:{ labels: nz.map(k=>k.klas), datasets:[{ data: nz.map(k=>k.jumlah),
          backgroundColor: nz.map(k=>KLAS_COLORS[k.klas]||'#8B95A0') }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}}} }
      });
    }
    
    const ctxKBar = document.getElementById('chartKlasBar');
    if(ctxKBar){
      const nz = klas.filter(k=>k.jumlah>0);
      chartRegistry['chartKlasBar'] = new Chart(ctxKBar, {
        type:'bar',
        data:{ labels: nz.map(k=>k.klas), datasets:[{ data: nz.map(k=>k.jumlah),
          backgroundColor: nz.map(k=>KLAS_COLORS[k.klas]||'#8B95A0'), borderRadius:4 }]},
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
          scales:{ x:{ ticks:{ callback:v=>fmtRp(v), font:{size:10} } }, y:{ ticks:{font:{size:10.5}} } } }
      });
    }
  }catch(err){ 
    console.error('Gagal menggambar grafik dashboard:', err); 
  }
}

/* ---------------- FITUR MUTASI SALDO ---------------- */
function showMutasiModal(){
  const overlay = document.createElement('div');
  overlay.className = 'mtg-modal-overlay';
  overlay.innerHTML = `
    <div class="mtg-modal">
      <h3>Mutasi Pindah Saldo</h3>
      <p>Pindahkan dana secara internal. Transaksi ini tidak akan dihitung sebagai Laba/Rugi bulanan perusahaan.</p>
      
      <div class="mtg-field" style="margin-bottom:12px;">
        <label>Tanggal Mutasi</label>
        <input type="date" class="mtg-input" id="mTanggal" value="${new Date().toISOString().slice(0,10)}">
      </div>
      
      <div class="mtg-form-grid" style="grid-template-columns:1fr 1fr; margin-bottom:12px;">
        <div class="mtg-field">
          <label>Dari Rekening/Kas</label>
          <select class="mtg-input" id="mDari">
            <option value="BCA">BCA</option>
            <option value="Cash">Cash Kantor</option>
          </select>
        </div>
        <div class="mtg-field">
          <label>Dipindah Ke</label>
          <select class="mtg-input" id="mKe">
            <option value="Cash" selected>Cash Kantor</option>
            <option value="BCA">BCA</option>
          </select>
        </div>
      </div>
      
      <div class="mtg-field" style="margin-bottom:12px;">
        <label>Nominal (IDR)</label>
        <input type="number" class="mtg-input" id="mJumlah" min="0" placeholder="Contoh: 500000">
      </div>
      
      <div class="mtg-field" style="margin-bottom:18px;">
        <label>Keterangan</label>
        <input class="mtg-input" id="mKeterangan" value="Tarik Tunai Keperluan Kantor" placeholder="cth. Tarik tunai ke Kas">
      </div>
      
      <div class="mtg-form-actions">
        <button class="mtg-btn mtg-btn-ghost" id="mCancel">Batal</button>
        <button class="mtg-btn mtg-btn-primary" id="mSave">Proses Mutasi</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Auto-toggle dropdown "Dari" dan "Ke" agar tidak sama
  document.getElementById('mDari').addEventListener('change', (e) => {
    document.getElementById('mKe').value = e.target.value === 'BCA' ? 'Cash' : 'BCA';
  });
  document.getElementById('mKe').addEventListener('change', (e) => {
    document.getElementById('mDari').value = e.target.value === 'BCA' ? 'Cash' : 'BCA';
  });

  document.getElementById('mCancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (ev) => { if(ev.target === overlay) overlay.remove(); });
  
  document.getElementById('mSave').addEventListener('click', async () => {
    const tgl = document.getElementById('mTanggal').value;
    const dari = document.getElementById('mDari').value;
    const ke = document.getElementById('mKe').value;
    const jumlah = Number(document.getElementById('mJumlah').value) || 0;
    const ket = document.getElementById('mKeterangan').value.trim();

    if(!tgl || jumlah <= 0 || dari === ke){
      alert('Mohon lengkapi nominal dan pastikan akun tujuan berbeda.'); return;
    }

    const baseId = uid();

    // Baris 1: Uang Keluar dari Akun Asal
    state.ledger.push({
      id: baseId + '_out', tanggal: tgl,
      kategori: 'Mutasi', klasifikasi: 'Mutasi', keterangan: ket + ` (Keluar dari ${dari})`,
      akun: dari, masuk: 0, keluar: jumlah
    });

    // Baris 2: Uang Masuk ke Akun Tujuan
    state.ledger.push({
      id: baseId + '_in', tanggal: tgl,
      kategori: 'Mutasi', klasifikasi: 'Mutasi', keterangan: ket + ` (Masuk ke ${ke})`,
      akun: ke, masuk: jumlah, keluar: 0
    });

    overlay.remove();
    await saveLedger();
    render();
  });
}

      kategori: document.getElementById('fKategori').value,

      keluar: Number(document.getElementById('fKeluar').value)||0,
    };
    if(!data.tanggal || !data.keterangan){ alert('Tanggal dan Keterangan wajib diisi.'); return; }
    if(isNew){ state.ledger.push({ id: uid(), ...data }); }
    else{ const idx = state.ledger.findIndex(r=>r.id===row.id); state.ledger[idx] = { ...state.ledger[idx], ...data }; }
    await saveLedger();

function confirmAndDeleteTxn(id){
  const row = state.ledger.find(r=>r.id===id);
  if(!row) return;
  showConfirmModal(
    'Hapus Transaksi?',
    `Transaksi "${row.keterangan}" (${fmtDate(row.tanggal)}) akan dihapus permanen.`,
    async () => {
      state.ledger = state.ledger.filter(r=>r.id!==id);
      await saveLedger();
      render();
    }
  );
}

        ${state.trips.map(t => {

          <div class="mtg-trip-item ${t.id===state.activeTripId?'active':''}" data-trip="${t.id}">

        </div>
      </div>
      <div id="tripDetailSlot"></div>
    </div>
  `;
  document.getElementById('mtgBody').innerHTML = html;

  document.querySelectorAll('[data-trip]').forEach(el => {
    el.addEventListener('click', () => { state.activeTripId = el.dataset.trip; state.editingTripExpenseId = null; renderTripDetail(); });
  });
  document.getElementById('btnNewTrip').addEventListener('click', showNewTripModal);

  setTimeout(() => {
    drawTripCompareChart(totalsAll);
  }, 50);
  renderTripDetail();
}

function drawTripCompareChart(totalsAll, retries = 0){
  if (typeof window.Chart === 'undefined') {
    if (retries < 20) {
      setTimeout(() => drawTripCompareChart(totalsAll, retries + 1), 250);
    } else {
       const el = document.getElementById('boxTripCompare');
       if(el) el.innerHTML = '<div style="color:var(--rust); padding:20px; font-size:12px; border:1px dashed var(--rust); border-radius:8px; text-align:center; width:100%;"><b>Error:</b> Pustaka grafik gagal diunduh.</div>';
    }
    return;
  }
  
  try{
    destroyChart('chartTripCompare');
    const ctx = document.getElementById('chartTripCompare');
    if(!ctx) return;
    chartRegistry['chartTripCompare'] = new Chart(ctx, {
      type:'bar',
      data:{ labels: totalsAll.map(x=>x.trip.nama),
        datasets:[
          {label:'Tarik Tunai', data: totalsAll.map(x=>x.tot.ditarik), backgroundColor:'#AD8A1E88', borderRadius:4},
          {label:'Total Pengeluaran Full', data: totalsAll.map(x=>x.tot.totalRealisasi), backgroundColor:'#123324', borderRadius:4},
        ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}},
        scales:{ y:{ ticks:{ callback:v=>fmtRp(v), font:{size:10} } } } }
    });
  }catch(err){ console.error('Gagal menggambar grafik perbandingan trip:', err); }
}

function renderExpenseForm(trip){

        <button class="mtg-btn mtg-btn-ghost" id="tCancel">Batal</button>
        <button class="mtg-btn mtg-btn-primary" id="tSave">Simpan</button>
      </div>
    </div>`;
  document.getElementById('tCancel').addEventListener('click', () => { slot.innerHTML=''; });
  document.getElementById('tSave').addEventListener('click', async () => {
    trip.nama = document.getElementById('tNama').value.trim() || trip.nama;
    trip.periode = document.getElementById('tPeriode').value.trim();
    
    await saveTripsAndSync();
    render();
  });
}

      <div class="mtg-field" style="margin-bottom:10px;"><label>Nama Trip</label><input class="mtg-input" id="ntNama" placeholder="cth. Zona 6" style="width:100%;"></div>

function confirmAndDeleteExpense(trip, expId){
  showConfirmModal('Hapus Pengeluaran?', 'Entri pengeluaran ini akan dihapus permanen.', async () => {
    trip.expenses = trip.expenses.filter(x => x.id !== expId);
    await saveTripsAndSync();
    render();
  });
}

/* ---------------- PDF export Trip ---------------- */
function generateTripPDF(trip){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert('Modul PDF belum siap dimuat. Coba lagi sesaat lagi.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
    const tot = tripTotals(trip);
    const katBreak = tripKategoriBreakdown(trip).filter(r=>r.jumlah>0);
    const metBreak = tripMetodeBreakdown(trip).filter(r=>r.jumlah>0);
    const marginX = 40;
    let y = 50;

    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(18,51,36);
    doc.text('Rekap Canvassing — ' + trip.nama, marginX, y);
    y += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,100,110);
    doc.text('Periode: ' + (trip.periode || '-'), marginX, y);
    doc.text('Dicetak: ' + new Date().toLocaleDateString('id-ID', {day:'2-digit',month:'long',year:'numeric'}), 400, y);
    y += 20;

    doc.setDrawColor(224,227,219);
    doc.line(marginX, y, 555, y);
    y += 20;

    const boxes = [
      ['Tarik Tunai', fmtRp(tot.ditarik)],
      ['Realisasi Cash', fmtRp(tot.realisasiCash)],
      ['Sisa Cash', fmtRp(tot.sisaCash)],
      ['BCA & Flazz', fmtRp(tot.realisasiNonCash)],
      ['Total Full', fmtRp(tot.totalRealisasi)],
    ];
    const boxW = 95, boxH = 46;
    boxes.forEach((b, i) => {
      const bx = marginX + i*(boxW+6);
      doc.setFillColor(i===4 ? 236 : 244, i===4 ? 238 : 245, i===4 ? 232 : 240);
      doc.roundedRect(bx, y, boxW, boxH, 4, 4, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(i===4 ? 18 : 91, i===4 ? 51 : 102, i===4 ? 36 : 114);
      doc.text(b[0].toUpperCase(), bx+6, y+16);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(18,51,36);
      doc.text(b[1], bx+6, y+34);
    });
    y += boxH + 22;

    if(katBreak.length){
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(18,51,36);
      doc.text('Rincian per Kategori', marginX, y);
      doc.autoTable({
        startY: y+8, margin:{left:marginX, right:40},
        head:[['Kategori','Jumlah (IDR)']],
        body: katBreak.map(r => [r.kategori, fmtRp(r.jumlah)]),
        styles:{ font:'helvetica', fontSize:9, cellPadding:5 },
        headStyles:{ fillColor:[18,51,36], textColor:255 },
        columnStyles:{ 1:{ halign:'right' } },
        theme:'grid',
      });
      y = doc.lastAutoTable.finalY + 20;
    }

    if(metBreak.length){
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(18,51,36);
      doc.text('Rincian per Metode Pembayaran', marginX, y);
      doc.autoTable({
        startY: y+8, margin:{left:marginX, right:40},
        head:[['Metode','Jumlah (IDR)']],
        body: metBreak.map(r => [r.metode, fmtRp(r.jumlah)]),
        styles:{ font:'helvetica', fontSize:9, cellPadding:5 },
        headStyles:{ fillColor:[18,51,36], textColor:255 },
        columnStyles:{ 1:{ halign:'right' } },
        theme:'grid',
      });
      y = doc.lastAutoTable.finalY + 20;
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(18,51,36);
    doc.text('Rincian Transaksi', marginX, y);
    const rows = [...trip.expenses].sort((a,b)=> a.tanggal < b.tanggal ? -1 : (a.tanggal>b.tanggal?1:0));
    doc.autoTable({
      startY: y+8, margin:{left:marginX, right:40},
      head:[['Tanggal','Kategori','Keterangan','Metode','Keluar Rek.','Realisasi']],
      body: rows.map(e => [
        fmtDate(e.tanggal), e.kategori, e.keterangan, e.metode,
        e.keluarRek ? fmtRp(e.keluarRek) : '-',
        e.realisasi ? fmtRp(e.realisasi) : '-',
      ]),
      styles:{ font:'helvetica', fontSize:8.5, cellPadding:4.5, overflow:'linebreak' },
      headStyles:{ fillColor:[18,51,36], textColor:255, fontSize:8.5 },
      columnStyles:{ 4:{ halign:'right' }, 5:{ halign:'right' } },
      theme:'grid',
      didDrawPage: (data) => {
        const pageCount = doc.internal.getNumberOfPages();
        doc.setFontSize(8); doc.setTextColor(139,149,160);
        doc.text('Arus Kas MTG — Canvassing ' + trip.nama, marginX, 820);
        doc.text('Hal. ' + doc.internal.getCurrentPageInfo().pageNumber + ' / ' + pageCount, 500, 820);
      }
    });

    const safeName = trip.nama.replace(/[^a-z0-9]+/gi,'_');
    doc.save('Canvassing_' + safeName + '.pdf');
  }catch(err){
    console.error('Gagal membuat PDF:', err);
    alert('Gagal membuat PDF. Silakan coba lagi.');
  }
}

function confirmAndDeleteTrip(trip){
  showConfirmModal('Hapus Trip?', `Trip "${trip.nama}" beserta seluruh entri pengeluarannya akan dihapus permanen.`, async () => {
    state.trips = state.trips.filter(t => t.id !== trip.id);
    state.activeTripId = state.trips.length ? state.trips[0].id : null;
    await saveTripsAndSync();
    render();
  });
}

/* ---------------- Confirm modal ---------------- */
function showConfirmModal(title, msg, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'mtg-modal-overlay';
  overlay.innerHTML = `
    <div class="mtg-modal">
      <h3>${title}</h3>
      <p>${msg}</p>
      <div class="mtg-form-actions">
        <button class="mtg-btn mtg-btn-ghost" id="cmCancel">Batal</button>
        <button class="mtg-btn mtg-btn-danger" style="background:var(--rust);color:#fff;" id="cmOk">Ya, Hapus</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cmCancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (ev) => { if(ev.target === overlay) overlay.remove(); });
  document.getElementById('cmOk').addEventListener('click', async () => { overlay.remove(); await onConfirm(); });
}

/* ---------------- Master render ---------------- */
function render(){
  renderTabs();
  
  // Hitung Saldo Dinamis (Total, BCA, Cash)
  let sTotal = 0;
  let sBCA = 0;
  let sCash = 0;

  sortedLedger().forEach(r => {
    const net = (Number(r.masuk)||0) - (Number(r.keluar)||0);
    sTotal += net;
    if (r.akun === 'BCA') sBCA += net;
    if (r.akun === 'Cash') sCash += net;
  });

  const pt = document.getElementById('headerSaldo');
  if(pt){ pt.textContent = fmtRp(sTotal); pt.style.color = sTotal < 0 ? '#F2B8A8' : '#fff'; }
  
  const pb = document.getElementById('headerBCA');
  if(pb){ pb.textContent = fmtRp(sBCA); pb.style.color = sBCA < 0 ? '#F2B8A8' : '#fff'; }
  
  const pc = document.getElementById('headerCash');
  if(pc){ pc.textContent = fmtRp(sCash); pc.style.color = sCash < 0 ? '#F2B8A8' : '#fff'; }

  if(state.activeTab === 'dashboard') renderDashboard();
  else if(state.activeTab === 'ledger') renderLedger();
  else if(state.activeTab === 'canvassing') renderCanvassing();
}

async function init(){
  await loadData();
  const years = availableYears();
  state.filterYear = years[years.length-1] || new Date().getFullYear();
  render();

  const refreshBtn = document.getElementById('btnManualRefresh');
  if(refreshBtn) {
    refreshBtn.addEventListener('click', () => loadData(false));
  }

  setInterval(() => {
    if (!state.editingTxnId && !state.editingTripExpenseId && !state.isSyncing) {
      loadData(true);
    }
  }, 15000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
